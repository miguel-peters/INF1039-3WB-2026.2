<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Calouro+</title>
    <link href="../Static/CSS/login.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div class="blue-center">

        <img src="../imgs/nome_calouro.png" width="200">

        <div class="caixa">
            <h1>Entrar</h1>
            <p>Bem-vindo <strong>Calouro!</strong> Por favor, faça login para continuar.</p>

            <form action="feed.html" method="get">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required
                       placeholder="Mínimo 8 caracteres"
                       pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                       title="Use 8 ou mais caracteres, com letra maiúscula, número e símbolo">
                <div class="barra"></div>
                <small class="forca"></small>

                <input type="submit" value="Entrar">
            </form>

            <div class="links">
                <p><a href="esqueci_senha.html">Esqueci minha senha</a></p>
                <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>

    </div>
</body>

</html>
