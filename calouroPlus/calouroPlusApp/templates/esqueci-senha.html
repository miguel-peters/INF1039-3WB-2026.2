<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/CSS/esqueci-senha.css">

    <title>Esqueceu sua senha? | Calouro+</title>
</head>
<body>
    <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d2b4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
            <path d="M22 10v6"/>
            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
        Calouro<span class="mais">+</span>
    </div>

    <div class="formulario">
        <h2>Esqueceu sua senha?</h2>
        <p>Digite o e-mail cadastrado na sua conta. Enviaremos um link para você criar uma nova senha.</p>

        <div class="icone">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1d2b4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                <path d="m16 19 2 2 4-4"/>
            </svg>
        </div>

        <form action="login.html" method="get">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <button type="submit">Enviar link de redefinição <span class="seta">→</span></button>
        </form>

        <p class="voltar"><a href="login.html">← Voltar para o login</a></p>
    </div>
</body>
</html>
