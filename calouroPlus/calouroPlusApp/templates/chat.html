{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'CSS/chat.css' %}">

    <title>Conversas</title>
</head>
<body>
    <header>
        <div class="logo"><img src="{% static 'nome_calouro.png' %}" width="150"></div>

        <nav>
            <a href="{% url 'feed' %}">Feed</a>
            <a href="{% url 'chat' %}" class="ativo">Conversas</a>
            <a href="{% url 'minhas_aulas' %}">Aulas</a>
        </nav>

        <div class="acoes">
            <button type="button" class="criar-aula">
                <nav>
                    <a href="{% url 'criar_aula' %}" width = "100">+ Criar Aula</a>
                </nav>
            </button>
            <span>🔔</span>
            <a href = "{% url 'perfil' %}"><img src="{% static 'gabriel.jpg' %}" alt="Foto de perfil"></a>
        </div>
    </header>

    <div class="conteudo">
        <h1>Conversas</h1>

        <input type="text" class="busca" placeholder="Pesquisar por nome ou matéria">

        <div class="abas">
            <button type="button" class="ativa">Como aluno</button>
            <button type="button">Como tutor</button>
        </div>

        {% for mensagem in mensagens %}
            <div>
                <p><strong>{{ mensagem.usuario_from }}</strong> para {{ mensagem.usuario_to }}</p>
                <p>{{ mensagem.mensagem }}</p>
            </div>
        {% endfor %}
    </div>
</body>
</html>
