{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'CSS/criar-aula.css' %}">

    <title>Criar aula | Calouro+</title>
</head>
<body>
    <header>
        <div class="logo">🎓 Calouro+</div>

        <nav>
            <a href="{% url 'feed' %}">Feed</a>
            <a href="{% url 'chat' %}">Conversas</a>
            <a href="{% url 'minhas_aulas' %}">Aulas</a>
        </nav>

        <div class="acoes">
            <a href="{% url 'criar_aula' %}" class="criar-aula">+ Criar aula</a>
            <span>🔔</span>
            <a href="{% url 'perfil' %}"><img src="{% static 'gabriel.jpg' %}" alt="Foto de perfil"></a>
        </div>
    </header>

    <div class="conteudo">
        <p class="amarelo">📅 NOVA ATIVIDADE ACADÊMICA</p>
        <h1>Criar uma aula</h1>
        <p class="cinza">Preencha as informações para publicar sua aula e ajudar outros alunos.</p>

        <div class="caixa">
            <div class="campo">
                <label for="materia">Matéria <span class="vermelho">*</span></label>
                <input type="text" id="materia" list="lista-materias" placeholder="Buscar matéria">

                <datalist id="lista-materias">
                    <option value="Álgebra Linear">
                    <option value="Bioquímica">
                    <option value="Cálculo 1">
                    <option value="Cálculo 2">
                    <option value="Estrutura de Dados">
                    <option value="Física 1">
                    <option value="Programação 1">
                </datalist>
            </div>

            <div class="campo">
                <div class="rotulo-linha">
                    <label for="descricao">Descrição <span class="vermelho">*</span></label>
                    <span class="limite">max 400 caracteres</span>
                </div>
                <textarea id="descricao" rows="6" maxlength="400" placeholder="Conte os tópicos que pretende cobrir e como a aula vai ajudar."></textarea>
            </div>

            <div class="campo">
                <div class="rotulo-linha">
                    <label for="horarios">Horários <span class="vermelho">*</span></label>
                    <span class="limite">max 400 caracteres</span>
                </div>
                <textarea id="horarios" rows="6" maxlength="400" placeholder="Conte os horários disponíveis para a aula. Como 'Segunda 14:00 - 15:00' ou 'Dias da semana das 14:00 até as 19:00'"></textarea>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="preco">Preço em R$</label>
                    <input type="number" id="preco" placeholder="Ex.: 50,00" step="0.01" min="0">
                </div>

                <div class="campo">
                    <label for="qtd">Qtd. máxima de alunos</label>
                    <input type="number" id="qtd" placeholder="Ex.: 5" min="1">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="modalidade">Modalidade</label>
                    <select id="modalidade">
                        <option>Não informar</option>
                        <option>Presencial</option>
                        <option>Online</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="selo">Selo</label>
                    <select id="selo">
                        <option>Sem selo</option>
                        <option>Monitor</option>
                        <option>Destaque</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label for="local">Local</label>
                <input type="text" id="local" placeholder="Ex.: Biblioteca Central">
            </div>

            <button type="button" class="publicar">Publicar aula</button>
            <p class="cancelar"><a href="{% url 'feed' %}">Cancelar e descartar</a></p>
        </div>
    </div>
</body>
</html>
