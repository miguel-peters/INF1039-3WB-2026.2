{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'CSS/conversas.css' %}">

    <title>Conversa | Calouro+</title>
</head>
<body>
    <header>
        <div class="logo">🎓 Calouro+</div>

        <nav>
            <a href="{% url 'feed' %}">Feed</a>
            <a href="{% url 'chat' %}" class="ativo">Conversas</a>
            <a href="{% url 'minhas_aulas' %}">Aulas</a>
        </nav>

        <div class="acoes">
            <a href="{% url 'criar_aula' %}" class="criar-aula">+ Criar aula</a>
            <span>🔔</span>
            <a href="{% url 'perfil' %}"><img src="{% static 'gabriel.jpg' %}" alt="Foto de perfil"></a>
        </div>
    </header>

    <div class="conteudo">
        <div class="chat-container">
            <div class="chat-header">
                {{ outro.nome|default:outro.username }}
            </div>

            <div class="chat-messages">
                {% for msg in mensagens %}
                    <div class="message {% if msg.usuario_from == user %}sent-message{% else %}received-message{% endif %}">
                        <p class="message-text">{{ msg.mensagem }}</p>
                        <p class="message-time">{{ msg.horario|date:"H:i" }}</p>
                    </div>
                {% empty %}
                    <p>Nenhuma mensagem ainda.</p>
                {% endfor %}
            </div>

            <form method="POST" class="message-input">
                {% csrf_token %}
                <input type="text" name="mensagem" class="input-field" placeholder="Digite sua mensagem..." required>
                <button type="submit" class="send-button">Enviar</button>
            </form>
        </div>
    </div>
</body>
</html>
