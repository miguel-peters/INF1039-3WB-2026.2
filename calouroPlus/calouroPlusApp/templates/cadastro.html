{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'CSS/cadastro.css' %}">

    <title>Cadastre-se | Calouro+</title>
</head>
<body>
    <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1d2b4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
            <path d="M22 10v6"/>
            <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
        Calouro<span class="mais">+</span>
    </div>

    <div class="formulario">
        <h2>Cadastre-se</h2>
        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}
        <p>Crie sua conta para achar aulas ou dar as suas.</p>

        <form action="{% url 'cadastro' %}" method="post">
            {% csrf_token %}
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha">
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirme a senha</label>
                <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Repita a senha">
            </div>

            <div class="campo">
                <label for="papel">Você é</label>
                <select id="papel" name="papel">
                    {% for papel in papeis %}
                        <option value="{{ papel.nome }}">{{ papel.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Continuar cadastro</button>
        </form>

        <p class="entrar">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
</body>
</html>
