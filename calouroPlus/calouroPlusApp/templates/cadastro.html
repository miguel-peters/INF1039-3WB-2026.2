{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'CSS/cadastro.css' %}">

    <title>Cadastro</title>
</head>
<body>
    <div class="logo"><img src="{% static 'nome_calouro.png' %}" width="200"></div>

    <div class="formulario">
        <h2>Cadastre-se</h2>
        <p>Crie sua conta para achar aulas ou dar as suas.</p>

        <form action="{% url 'completar cadastro' %}" method="get">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha">
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirme a senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a senha">
            </div>

            <div class="campo">
                <label for="papel">Você é</label>
                <select id="papel" name="papel">
                    {% for papel in papeis %}
                        <option value="{{ papel.nome }}">{{ papel.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Continuar cadastro</button>
        </form>

        <p class="entrar">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
</body>
</html>
