<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar cadastro | Calouro+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Static/CSS/completar_cadastro.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>Calouro+</h1>
        </div>
    </header>

    <main>
        <div class="card-cadastro">
            <h2>Quase lá</h2>
            <p>Conte um pouco sobre você para começar a usar o Calouro+.</p>
            <form method="POST">
            {% csrf_token %}
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Como você se chama?" required>
                <label for="curso">Curso</label>

                <select id="curso" name="curso" required>
                    <option value="" disabled selected>Selecione seu curso</option>
                    {% for curso in cursos %}
                    <option value="{{ curso.id }}">{{ curso.nome }}</option>
                    {% endfor %}
                </select>
                <label for="materias">MATÉRIAS DE INTERESSE</label>
                <select id="materias" name="materias" multiple>
                    {% for disciplina in disciplinas %}
                    <option value="{{ disciplina.id }}">
                    {{ disciplina.nome }}
                    </option>
                    {% endfor %}
                </select>
                <button type="submit">Concluir e ver o feed</button>
            </form>
        </div>
    </main>

</body>
</html>
