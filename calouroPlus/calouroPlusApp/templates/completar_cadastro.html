
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar cadastro | Calouro+</title>

    <link rel="stylesheet" href="{% static 'CSS/completar_cadastro.css' %}">
</head>
<body>

    <header>
        <div class="logo">
            <img src="{% static 'nome_calouro.png' %}"
                 width="200" alt="Calouro+">
        </div>
    </header>

    <main>
        <div class="card-cadastro">
            <h2>Quase lá</h2>
            <p>Conte um pouco sobre você para começar a usar o Calouro+.</p>

            <form method="POST" id="form-cadastro">
                {% csrf_token %}

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Como você se chama?"
                    required
                >

                <label for="curso">Curso</label>

                <div class="campo-autocomplete">
                    <input
                        type="text"
                        id="curso"
                        name="curso"
                        placeholder="Digite seu curso"
                        maxlength="50"
                        autocomplete="off"
                        required
                    >

                    <div
                        id="sugestoes-cursos"
                        class="lista-sugestoes"
                    ></div>
                </div>

                <label for="materia-input">
                    MATÉRIAS DE INTERESSE
                </label>

                <div id="materias-selecionadas"></div>

                <div class="campo-autocomplete">
                    <input
                        type="text"
                        id="materia-input"
                        placeholder="Digite uma matéria"
                        autocomplete="off"
                    >

                    <div
                        id="sugestoes-materias"
                        class="lista-sugestoes"
                    ></div>
                </div>

                <input
                    type="hidden"
                    id="materias"
                    name="materias"
                >

                <button
                    type="submit"
                    class="botao-concluir"
                    style="background-color:#1d2b4f;color:white;"
                >
                    Concluir e ver o feed
                </button>
            </form>
        </div>
    </main>

    {{ cursos|json_script:"dados-cursos" }}
    {{ disciplinas|json_script:"dados-disciplinas" }}

    <script>
        // DADOS RECEBIDOS DO DJANGO

        const cursosAdmin = JSON.parse(
            document.getElementById("dados-cursos").textContent
        );

        const nomesCursos = cursosAdmin.map(
            curso => curso.nome
        );

        const disciplinasAdmin = JSON.parse(
            document.getElementById("dados-disciplinas").textContent
        );

        const nomesDisciplinas = disciplinasAdmin.map(
            disciplina => disciplina.nome
        );


        // ELEMENTOS DO FORMULÁRIO

        const campoCurso = document.getElementById("curso");
        const sugestoesCursos = document.getElementById("sugestoes-cursos");

        const campo = document.getElementById("materia-input");
        const sugestoes = document.getElementById("sugestoes-materias");
        const selecionadas = document.getElementById("materias-selecionadas");
        const oculto = document.getElementById("materias");
        const formulario = document.getElementById("form-cadastro");

        let materias = [];


        // IGNORAR ACENTOS E MAIÚSCULAS

        function normalizar(texto) {
            return texto
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
        }


        // AUTOCOMPLETE DOS CURSOS

        function mostrarSugestoesCursos() {
            const busca = normalizar(campoCurso.value);

            sugestoesCursos.innerHTML = "";

            if (!busca) {
                sugestoesCursos.style.display = "none";
                return;
            }

            const resultados = nomesCursos.filter(nome =>
                normalizar(nome).includes(busca)
            );

            if (resultados.length === 0) {
                sugestoesCursos.style.display = "none";
                return;
            }

            resultados.forEach(nome => {
                const opcao = document.createElement("div");

                opcao.className = "opcao-sugestao";
                opcao.textContent = nome;

                opcao.addEventListener("click", () => {
                    campoCurso.value = nome;
                    sugestoesCursos.innerHTML = "";
                    sugestoesCursos.style.display = "none";
                });

                sugestoesCursos.appendChild(opcao);
            });

            sugestoesCursos.style.display = "block";
        }

        campoCurso.addEventListener(
            "input",
            mostrarSugestoesCursos
        );


        // MATÉRIAS SELECIONADAS

        function atualizarMaterias() {
            oculto.value = materias.join(",");
            selecionadas.innerHTML = "";

            materias.forEach((materia, indice) => {
                const tag = document.createElement("span");

                tag.className = "materia-tag";
                tag.textContent = materia + " ×";

                tag.addEventListener("click", () => {
                    materias.splice(indice, 1);
                    atualizarMaterias();
                    mostrarSugestoes();
                });

                selecionadas.appendChild(tag);
            });
        }


        // ADICIONAR MATÉRIA

        function adicionarMateria(nome) {
            nome = nome.trim();

            if (
                nome &&
                !nome.includes(",") &&
                !materias.some(
                    materia => normalizar(materia) === normalizar(nome)
                )
            ) {
                materias.push(nome);
                atualizarMaterias();
            }

            campo.value = "";
            sugestoes.innerHTML = "";
            sugestoes.style.display = "none";
        }


        // AUTOCOMPLETE DAS MATÉRIAS

        function mostrarSugestoes() {
            const busca = normalizar(campo.value);

            sugestoes.innerHTML = "";

            if (!busca) {
                sugestoes.style.display = "none";
                return;
            }

            const resultados = nomesDisciplinas.filter(nome => {
                return (
                    normalizar(nome).includes(busca) &&
                    !materias.some(
                        materia => normalizar(materia) === normalizar(nome)
                    )
                );
            });

            if (resultados.length === 0) {
                sugestoes.style.display = "none";
                return;
            }

            resultados.forEach(nome => {
                const opcao = document.createElement("div");

                opcao.className = "opcao-sugestao";
                opcao.textContent = nome;

                opcao.addEventListener("click", () => {
                    adicionarMateria(nome);
                });

                sugestoes.appendChild(opcao);
            });

            sugestoes.style.display = "block";
        }

        campo.addEventListener("input", mostrarSugestoes);

        campo.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();

                if (campo.value.trim()) {
                    adicionarMateria(campo.value);
                }
            }
        });


        // FECHAR SUGESTÕES AO CLICAR FORA

        document.addEventListener("click", event => {
            if (!event.target.closest(".campo-autocomplete")) {
                sugestoes.style.display = "none";
                sugestoesCursos.style.display = "none";
            }
        });


        // ENVIAR MATÉRIAS AO DJANGO

        formulario.addEventListener("submit", () => {
            if (campo.value.trim()) {
                adicionarMateria(campo.value);
            }
        });
    </script>

</body>
</html>
