{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar cadastro | Calouro+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'CSS/completar_cadastro.css' %}">
</head>
<body>

    <header>
        <div class="logo">
            <img src="{% static 'nome_calouro.png' %}" width="200">
        </div>
    </header>

    <main>
        <div class="card-cadastro">
            <h2>Quase lá</h2>
            <p>Conte um pouco sobre você para começar a usar o Calouro+.</p>
            <form method="POST">
            {% csrf_token %}
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Como você se chama?" required>

                <label for="curso">Curso</label>
                    <input
                        type="text"
                        id="curso"
                        name="curso"
                        list="lista-cursos"
                        placeholder="Digite seu curso"
                        maxlength="50"
                        required
                    >

                    <datalist id="lista-cursos">
                        {% for curso in cursos %}
                        <option value="{{ curso.nome }}">
                        {% endfor %}
                    </datalist>

                <label for="materia-input">MATÉRIAS DE INTERESSE</label>

<div id="materias-selecionadas"></div>

<input
    type="text"
    id="materia-input"
    list="lista-materias"
    placeholder="Digite uma matéria e pressione Enter"
    autocomplete="off"
>

<datalist id="lista-materias">
    {% for disciplina in disciplinas %}
        <option value="{{ disciplina.nome }}">
    {% endfor %}
</datalist>

<input type="hidden" id="materias" name="materias">

                <button type="submit">Concluir e ver o feed</button>
            </form>
        </div>
    </main>
<script>
const campo = document.getElementById("materia-input");
const selecionadas = document.getElementById("materias-selecionadas");
const oculto = document.getElementById("materias");

let materias = [];

function atualizarMaterias() {
    oculto.value = materias.join(",");
    selecionadas.innerHTML = "";

    materias.forEach((materia, indice) => {
        const tag = document.createElement("span");
        tag.textContent = materia + " × ";
        tag.style.cssText = "display:inline-block;padding:8px;margin:4px;background:#eee;border-radius:6px;cursor:pointer";

        tag.onclick = () => {
            materias.splice(indice, 1);
            atualizarMaterias();
        };

        selecionadas.appendChild(tag);
    });
}

function adicionarMateria() {
    const nome = campo.value.trim();

    if (nome && !nome.includes(",") &&
        !materias.some(m => m.toLowerCase() === nome.toLowerCase())) {
        materias.push(nome);
        atualizarMaterias();
    }

    campo.value = "";
}

campo.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        event.preventDefault();
        adicionarMateria();
    }
});

campo.addEventListener("change", adicionarMateria);

document.querySelector(".card-cadastro form").addEventListener("submit", () => {
    if (campo.value.trim()) {
        adicionarMateria();
    }
});
</script>
</body>
</html>
